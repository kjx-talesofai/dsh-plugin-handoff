name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No install step: the package has no runtime dependencies, and the suite
      # skips the end-to-end case when the `zstd` binary is absent.
      - run: npm test

      - name: The tarball ships only runtime files
        run: |
          npm pack --dry-run > "$RUNNER_TEMP/pack.txt" 2>&1
          cat "$RUNNER_TEMP/pack.txt"
          for expected in index.js client.js cordis.patch.yml lib/export.mjs \
                          bin/dsh-handoff.mjs assets/icon.svg README.md LICENSE; do
            grep -qF "$expected" "$RUNNER_TEMP/pack.txt" || { echo "::error::missing from the tarball: $expected"; exit 1; }
          done
          for dev_only in 'tests/' 'probe/' '.github/'; do
            if grep -qF "$dev_only" "$RUNNER_TEMP/pack.txt"; then
              echo "::error::dev-only file in the tarball: $dev_only"
              exit 1
            fi
          done
